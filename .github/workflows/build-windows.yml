name: NOVA CUT 14.0 - STUDIO DESKTOP Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['release/nova-cut-14.0-studio-desktop']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Pobierz projekt 14.0
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrola plikow i skryptow
        run: |
          node --check main.js
          node --check preload.js
          node --check native-renderer.js
          npm run check
      - name: Sprawdz nowa ikone Windows
        shell: pwsh
        run: |
          if (!(Test-Path assets/novacut.ico)) {throw "Icon assets/novacut.ico missing"}
          if ((Get-Item assets/novacut.ico).Length -lt 1024) {throw "Icon invalid"}
      - name: Przygotuj silnik napisow Whisper offline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path whisper | Out-Null
          $source='https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip'
          Invoke-WebRequest -Uri $source -OutFile whisper-bin.zip
          Expand-Archive -Path whisper-bin.zip -DestinationPath whisper-package -Force
          $exe=Get-ChildItem -Path whisper-package -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (!$exe) {throw 'Whisper CLI missing from downloaded Windows release.'}
          Copy-Item $exe.FullName whisper/whisper-cli.exe
          Get-ChildItem -Path $exe.Directory.FullName -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName whisper/ }
          $url='https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin'
          Invoke-WebRequest -Uri $url -OutFile whisper/ggml-base.bin
          if ((Get-Item whisper/ggml-base.bin).Length -lt 100MB) {throw 'Downloaded Whisper model is incomplete.'}
          Write-Host "Model Whisper base: $([math]::Round((Get-Item whisper/ggml-base.bin).Length/1MB)) MB"
          $tinyUrl='https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin'
          Invoke-WebRequest -Uri $tinyUrl -OutFile whisper/ggml-tiny.bin
          if ((Get-Item whisper/ggml-tiny.bin).Length -lt 50MB) {throw 'Model Whisper Tiny is missing or incomplete.'}
          Write-Host "Model Whisper tiny: $([math]::Round((Get-Item whisper/ggml-tiny.bin).Length/1MB)) MB"
      - name: Zainstaluj zaleznosci
        run: npm install --no-audit --no-fund
      - name: Test napisow MP4 mov_text (FFmpeg)
        run: node scripts/check-subtitle-render.js
      - name: Zbuduj Setup i Portable Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Sprawdz prawdziwy FFprobe i FFmpeg w aplikacji Windows (poza ASAR)
        shell: pwsh
        run: |
          $tools=Join-Path 'dist/win-unpacked/resources' 'tools'
          $probe=Join-Path $tools 'ffprobe.exe'
          $ffmpeg=Join-Path $tools 'ffmpeg.exe'
          if(!(Test-Path $probe)){throw "FFprobe missing from $probe"}
          if(!(Test-Path $ffmpeg)){throw "FFmpeg missing from $ffmpeg"}
          $probeVersion = & $probe -version
          if($LASTEXITCODE -ne 0){throw 'FFprobe failed to start'}
          Write-Host $probeVersion[0]
          $ffmpegVersion = & $ffmpeg -version
          if($LASTEXITCODE -ne 0){throw 'FFmpeg failed to start'}
          Write-Host $ffmpegVersion[0]
          $sample=Join-Path $env:RUNNER_TEMP 'nova-probe-test.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=red:s=320x180:r=24:d=1' -c:v libx264 -pix_fmt yuv420p -y $sample
          if($LASTEXITCODE -ne 0){throw 'Could not generate MP4 fixture'}
          $resolution=(& $probe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 $sample).Trim()
          if($LASTEXITCODE -ne 0 -or $resolution -ne '320x180'){throw "Probe returned invalid video dimensions: $resolution"}
          Write-Host 'PASS: packaged FFprobe starts and analyzes 320x180 MP4.'
      - name: Dodaj zaawansowany offline model Whisper Small (quantized)
        shell: pwsh
        run: |
          $url='https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin'
          Invoke-WebRequest -Uri $url -OutFile dist/ggml-small-q5_1.bin
          if ((Get-Item dist/ggml-small-q5_1.bin).Length -lt 170MB) {throw 'Incomplete Whisper Small model.'}
          $expected='ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb'
          $actual=(Get-FileHash dist/ggml-small-q5_1.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {throw "Whisper model SHA256 mismatch: $actual"}
      - name: Sprawdz rozmiar i zawartosc pakietu
        shell: pwsh
        run: |
          $exes=@(Get-ChildItem dist -Filter '*.exe' -File)
          if($exes.Count -lt 2){throw 'Expected two Windows executables.'}
          $exes | Select-Object Name, Length | Format-Table
          Compress-Archive -Path 'dist/*.exe','dist/ggml-small-q5_1.bin' -DestinationPath 'dist/NOVA-CUT-14.0-STUDIO-DESKTOP-WINDOWS.zip' -CompressionLevel Optimal -Force
          $sizeMB=[math]::Round((Get-Item 'dist/NOVA-CUT-14.0-STUDIO-DESKTOP-WINDOWS.zip').Length/1MB,2)
          Write-Host "Pakiet NOVA CUT 14.0: $sizeMB MB (cel 1000-1100 MB)"
          if($sizeMB -lt 1000 -or $sizeMB -gt 1100){Write-Warning 'Actual package is outside target size 1000-1100 MB; please verify before release.'}
      - name: Udostepnij instalator i Portable
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-CUT-Windows-14.0-STUDIO-DESKTOP
          path: dist/NOVA-CUT-14.0-STUDIO-DESKTOP-WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
