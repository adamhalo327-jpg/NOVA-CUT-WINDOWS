name: NOVA CUT 14.0 - STUDIO DESKTOP Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['release/nova-cut-14.0-studio-desktop']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Pobierz projekt 14.0
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrola plikow i skryptow
        run: |
          node --check main.js
          node --check preload.js
          node --check native-renderer.js
          npm run check
      - name: Sprawdz nowa ikone Windows
        shell: pwsh
        run: |
          if (!(Test-Path assets/novacut.ico)) {throw "Icon assets/novacut.ico missing"}
          if ((Get-Item assets/novacut.ico).Length -lt 1024) {throw "Icon invalid"}
      - name: Przywroc zapisane zasoby Whisper
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper
          key: nova-cut-whisper-b5454-base-tiny-win-x64-v1
      - name: Przygotuj silnik napisow Whisper offline
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          function Download-WithRetry([string]$Uri,[string]$OutFile) {
            for ($attempt=1; $attempt -le 4; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -MaximumRedirection 10 -TimeoutSec 150 -ErrorAction Stop
                if (!(Test-Path $OutFile) -or (Get-Item $OutFile).Length -lt 100KB) { throw "Downloaded file is missing or empty: $OutFile" }
                return
              } catch {
                if (Test-Path $OutFile) { Remove-Item $OutFile -Force -ErrorAction SilentlyContinue }
                if ($attempt -ge 4) { throw }
                Write-Warning "Download attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
          New-Item -ItemType Directory -Force -Path whisper | Out-Null
          $source='https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip'
          $exe=$null
          try {
            Download-WithRetry $source whisper-bin.zip
            Expand-Archive -Path whisper-bin.zip -DestinationPath whisper-package -Force
            $exe=Get-ChildItem -Path whisper-package -Recurse -Filter whisper-cli.exe | Select-Object -First 1
            if (!$exe) {throw 'No whisper-cli.exe in official binary archive.'}
            Write-Host 'Using official Whisper prebuilt CLI.'
          } catch {
            # GitHub Releases assets can return HTTP 504. Use Git clone + CMake,
            # not an unverified third-party download mirror.
            Write-Warning "Whisper release asset unavailable: $($_.Exception.Message)"
            Write-Host 'Building official pinned Whisper b5454 from source with MSVC.'
            git clone --depth 1 --branch b5454 https://github.com/ggml-org/whisper.cpp.git whisper-src
            if ($LASTEXITCODE -ne 0) {throw 'Whisper source clone failed'}
            cmake -S whisper-src -B whisper-build -A x64 -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DWHISPER_SDL2=OFF
            if ($LASTEXITCODE -ne 0) {throw 'Whisper CMake configure failed'}
            cmake --build whisper-build --config Release --target whisper-cli --parallel 4
            if ($LASTEXITCODE -ne 0) {throw 'Whisper CMake build failed'}
            $exe=Get-ChildItem -Path whisper-build -Recurse -Filter whisper-cli.exe -File | Select-Object -First 1
            if (!$exe) {throw 'Whisper CLI missing after source build'}
          }
          Copy-Item $exe.FullName whisper/whisper-cli.exe -Force
          # Distributed prebuilt releases ship required runtime DLLs in the same dir.
          # A CMake static build usually does not require DLLs, but copy if present.
          if (Test-Path whisper-build) {
            Get-ChildItem -Path whisper-build -Recurse -Filter '*.dll' -File |
              ForEach-Object { Copy-Item $_.FullName whisper/ -Force }
          } else {
            Get-ChildItem -Path $exe.Directory.FullName -Filter '*.dll' -File |
              ForEach-Object { Copy-Item $_.FullName whisper/ -Force }
          }
          if ((Get-Item whisper/whisper-cli.exe).Length -lt 100KB) {throw 'Whisper binary incomplete'}
          Write-Host "PASS: Whisper CLI binary ready: $((Get-Item whisper/whisper-cli.exe).Length) bytes"
          $url='https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin'
          Download-WithRetry $url whisper/ggml-base.bin
          if ((Get-Item whisper/ggml-base.bin).Length -lt 100MB) {throw 'Downloaded Whisper model is incomplete.'}
          Write-Host "Model Whisper base: $([math]::Round((Get-Item whisper/ggml-base.bin).Length/1MB)) MB"
          $tinyUrl='https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin'
          Download-WithRetry $tinyUrl whisper/ggml-tiny.bin
          if ((Get-Item whisper/ggml-tiny.bin).Length -lt 50MB) {throw 'Model Whisper Tiny is missing or incomplete.'}
          Write-Host "Model Whisper tiny: $([math]::Round((Get-Item whisper/ggml-tiny.bin).Length/1MB)) MB"
      - name: "Zainstaluj zaleznosci (FFmpeg: GitHub / mirror awaryjny)"
        shell: pwsh
        run: |
          # ffmpeg-static supports FFMPEG_BINARIES_URL (documented by its maintainers).
          # If GitHub Releases returns HTTP 504, switch to its documented mirror.
          $mirror='https://cdn.npmmirror.com/binaries/ffmpeg-static'
          for ($attempt=1; $attempt -le 6; $attempt++) {
            if ($attempt -ge 3) {
              $env:FFMPEG_BINARIES_URL=$mirror
              Write-Host "FFmpeg download: fallback mirror, attempt $attempt"
            } else {
              Remove-Item Env:FFMPEG_BINARIES_URL -ErrorAction SilentlyContinue
              Write-Host "FFmpeg download: primary GitHub Releases, attempt $attempt"
            }
            npm install --no-audit --no-fund
            $npmOk=($LASTEXITCODE -eq 0)
            $ffmpegOk=Test-Path 'node_modules/ffmpeg-static/ffmpeg.exe'
            $ffprobeOk=Test-Path 'node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe'
            if ($npmOk -and $ffmpegOk -and $ffprobeOk) {
              Write-Host 'PASS: npm dependencies + FFmpeg + FFprobe executables are available.'
              break
            }
            if ($attempt -ge 6) { throw 'NPM/FFmpeg dependency download failed from primary and mirror.' }
            Write-Warning "Attempt $attempt failed. npm=$npmOk, ffmpeg=$ffmpegOk, ffprobe=$ffprobeOk"
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Test napisow MP4 mov_text (FFmpeg)
        run: node scripts/check-subtitle-render.js
      - name: Przywroc cache Electron i elektron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: nova-cut-windows-electron-v43.8-builder-v26
      - name: Zbuduj Setup i Portable Windows
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $env:DEBUG='electron-builder*'
          for ($attempt=1; $attempt -le 5; $attempt++) {
            if ($attempt -eq 1) {
              Remove-Item Env:ELECTRON_MIRROR -ErrorAction SilentlyContinue
              Remove-Item Env:ELECTRON_BUILDER_BINARIES_MIRROR -ErrorAction SilentlyContinue
              Write-Host 'Electron source: primary downloads'
            } else {
              $env:ELECTRON_MIRROR='https://npmmirror.com/mirrors/electron/'
              $env:ELECTRON_BUILDER_BINARIES_MIRROR='https://npmmirror.com/mirrors/electron-builder-binaries/'
              Write-Host "Electron source: documented alternate mirror, attempt $attempt"
            }
            npm run build:win
            if ($LASTEXITCODE -eq 0) {
              $built=@(Get-ChildItem dist -Filter '*.exe' -File -ErrorAction SilentlyContinue)
              if ($built.Count -ge 2) {
                Write-Host "PASS: Windows Setup and Portable created ($($built.Count) EXE files)."
                break
              }
              Write-Warning 'Build exited 0 without two EXE outputs.'
            }
            if ($attempt -ge 5) {throw 'Windows Electron build failed after 5 primary/mirror attempts.'}
            Write-Warning "Electron builder attempt $attempt failed, retrying after backoff."
            Start-Sleep -Seconds (8 * $attempt)
          }
      - name: Sprawdz prawdziwy FFprobe i FFmpeg w aplikacji Windows (poza ASAR)
        shell: pwsh
        run: |
          $tools=Join-Path 'dist/win-unpacked/resources' 'tools'
          $probe=Join-Path $tools 'ffprobe.exe'
          $ffmpeg=Join-Path $tools 'ffmpeg.exe'
          if(!(Test-Path $probe)){throw "FFprobe missing from $probe"}
          if(!(Test-Path $ffmpeg)){throw "FFmpeg missing from $ffmpeg"}
          $probeVersion = & $probe -version
          if($LASTEXITCODE -ne 0){throw 'FFprobe failed to start'}
          Write-Host $probeVersion[0]
          $ffmpegVersion = & $ffmpeg -version
          if($LASTEXITCODE -ne 0){throw 'FFmpeg failed to start'}
          Write-Host $ffmpegVersion[0]
          $sample=Join-Path $env:RUNNER_TEMP 'nova-probe-test.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=red:s=320x180:r=24:d=1' -c:v libx264 -pix_fmt yuv420p -y $sample
          if($LASTEXITCODE -ne 0){throw 'Could not generate MP4 fixture'}
          $resolution=(& $probe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 $sample).Trim()
          if($LASTEXITCODE -ne 0 -or $resolution -ne '320x180'){throw "Probe returned invalid video dimensions: $resolution"}
          Write-Host 'PASS: packaged FFprobe starts and analyzes 320x180 MP4.'
      - name: Dodaj zaawansowany offline model Whisper Small (quantized)
        shell: pwsh
        run: |
          $url='https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin'
          for ($attempt=1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile dist/ggml-small-q5_1.bin -TimeoutSec 150 -ErrorAction Stop
              break
            } catch {
              if (Test-Path dist/ggml-small-q5_1.bin) {Remove-Item dist/ggml-small-q5_1.bin -Force}
              if ($attempt -ge 4) {throw}
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if ((Get-Item dist/ggml-small-q5_1.bin).Length -lt 170MB) {throw 'Incomplete Whisper Small model.'}
          $expected='ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb'
          $actual=(Get-FileHash dist/ggml-small-q5_1.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {throw "Whisper model SHA256 mismatch: $actual"}
      - name: Sprawdz rozmiar i zawartosc pakietu
        shell: pwsh
        run: |
          $exes=@(Get-ChildItem dist -Filter '*.exe' -File)
          if($exes.Count -lt 2){throw 'Expected two Windows executables.'}
          $exes | Select-Object Name, Length | Format-Table
          Compress-Archive -Path 'dist/*.exe','dist/ggml-small-q5_1.bin' -DestinationPath 'dist/NOVA-CUT-14.0-STUDIO-DESKTOP-WINDOWS.zip' -CompressionLevel Optimal -Force
          $sizeMB=[math]::Round((Get-Item 'dist/NOVA-CUT-14.0-STUDIO-DESKTOP-WINDOWS.zip').Length/1MB,2)
          Write-Host "Pakiet NOVA CUT 14.0: $sizeMB MB (cel 1000-1100 MB)"
          if($sizeMB -lt 1000 -or $sizeMB -gt 1100){Write-Warning 'Actual package is outside target size 1000-1100 MB; please verify before release.'}
      - name: Udostepnij instalator i Portable
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-CUT-Windows-14.0-STUDIO-DESKTOP
          path: dist/NOVA-CUT-14.0-STUDIO-DESKTOP-WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
